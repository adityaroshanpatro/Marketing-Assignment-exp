# Study 1B-A model roster.
#
# provider: anthropic | openai_compat | google | mock
#   openai_compat covers OpenAI, OpenRouter, Together, Groq, DeepSeek, Fireworks
#   and a local vLLM / Ollama server (set base_url).
# model: the EXACT API model string. Verify each one in the provider's model list
#   and run `python run.py check` before any real run. FILL_ME = not set yet.
# temperature: number, or null to leave it out (some reasoning models reject it).
# price_in / price_out: USD per million tokens, from the provider's pricing page
#   (used only by `python run.py estimate`; leave 0 if unknown).
#
# Simplest setup: one OpenRouter key (OPENROUTER_API_KEY) reaches closed and
# open-weight models alike. Direct provider keys are cheaper at volume (batch APIs).

defaults:
  max_tokens: 400
  temperature: 0
  max_concurrency: 4

models:
  # ---------------- closed: Anthropic ----------------
  - name: claude-haiku-5-5
    provider: anthropic
    model: claude-haiku-5-5
    api_key_env: ANTHROPIC_API_KEY
    temperature: null         # current Claude API/SDK does not expose temperature
    family: anthropic
    openness: closed
    tier: small
    enabled: true
    price_in: 0.10            # prompts <=100k tokens
    price_out: 0.50

  - name: claude-opus-5-5
    provider: anthropic
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    temperature: null         # current Claude API/SDK does not expose temperature
    family: anthropic
    openness: closed
    tier: flagship
    enabled: false
    price_in: 4
    price_out: 20

  # ---------------- closed: OpenAI ----------------
  - name: openai-mini
    provider: openai_compat
    model: gpt-6-luna         # OpenAI's small/efficient tier (no "mini" name); unconfirmed until run.py check
    api_key_env: OPENAI_API_KEY
    max_tokens_param: max_completion_tokens
    temperature: null
    family: openai
    openness: closed
    tier: small
    enabled: true
    price_in: 0.10
    price_out: 0.50

  - name: openai-flagship
    provider: openai_compat
    model: gpt-6-astra        # unconfirmed until run.py check
    api_key_env: OPENAI_API_KEY
    max_tokens_param: max_completion_tokens
    temperature: null
    family: openai
    openness: closed
    tier: flagship
    enabled: false
    price_in: 10
    price_out: 50

  # ---------------- closed: Google ----------------
  - name: gemini-flash
    provider: google
    model: gemini-3.8-flash   # stable; unconfirmed until run.py check
    api_key_env: GEMINI_API_KEY
    family: google
    openness: closed
    tier: small
    enabled: true
    price_in: 0.75            # rises to 1.50 / 7.50 on 1 Jan 2027
    price_out: 3.75

  - name: gemini-pro
    provider: google
    model: FILL_ME            # no stable Pro as of 29 Oct 2026 (only gemini-3.1-pro-preview); decide
    api_key_env: GEMINI_API_KEY
    family: google
    openness: closed
    tier: flagship
    enabled: false

  # ---------------- open-weight (via OpenRouter) ----------------
  - name: llama-4
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: meta-llama/llama-4-maverick   # unconfirmed until run.py check
    api_key_env: OPENROUTER_API_KEY
    family: meta
    openness: open
    tier: flagship
    enabled: false
    price_in: 0.188
    price_out: 0.652

  - name: qwen
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen3.8-2.4t-a95b   # largest open-weight Qwen (qwen3.8-max is closed); unconfirmed
    api_key_env: OPENROUTER_API_KEY
    family: alibaba
    openness: open
    tier: flagship
    enabled: false
    price_in: 2.0
    price_out: 6.0

  - name: deepseek
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4.1-flash   # open weights on HF; unconfirmed until run.py check
    api_key_env: OPENROUTER_API_KEY
    family: deepseek
    openness: open
    tier: small
    enabled: true             # pilot open-weight model
    price_in: 0.045
    price_out: 0.50
